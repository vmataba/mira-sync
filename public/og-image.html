<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
      color: white;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    .logo-inner {
      width: 80px;
      height: 80px;
      position: relative;
    }
    .circle {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 40px;
      height: 40px;
      border: 5px solid white;
      border-radius: 50%;
    }
    .square {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 6px;
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      margin: 0 0 20px 0;
      letter-spacing: -2px;
    }
    p {
      font-size: 32px;
      font-weight: 500;
      margin: 0;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-inner">
        <div class="circle"></div>
        <div class="square"></div>
      </div>
    </div>
    <h1>Mira Sync</h1>
    <p>Family Task & Goal Planning Made Simple</p>
  </div>
</body>
</html>
